services:
  qudingtong:
    image: xiaoluya/qudingtong:1.3.8@sha256:f8a01b2d5f08a0f2f739fdece4640f2eeec0bc458113ae7d3d03967bfc0f166d
    container_name: qudingtong
    user: "${QDT_UID:-1000}:${QDT_GID:-1000}"
    restart: unless-stopped
    ports:
      - "8282:8282"
    environment:
      PORT: "8282"
      TZ: "Asia/Shanghai"
      NODE_ENV: "production"
      WEB_CONCURRENCY: "4"
      DATA_DIR: "/app/data"
      QDT_DB_DIR: "/app/data"
      QDT_SECURITY_DB_DIR: "/app/data/security"
      QDT_BACKUP_DIR: "/app/backups"
      BOOTSTRAP_ADMIN_USER: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 中设置管理员初始密码}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      QDT_BACKUP_PEPPER: "${QDT_BACKUP_PEPPER:-}"
      QDT_AGENT_TOKEN: "${QDT_AGENT_TOKEN:-}"
      QDT_SECURE_COOKIE: "0"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8282/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
